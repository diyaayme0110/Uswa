name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create the Android project from index.html
        shell: bash
        run: |
          set -e
          W="$GITHUB_WORKSPACE"
          A="$RUNNER_TEMP/uswa"
          rm -rf "$A"
          mkdir -p "$A"
          cd "$A"
          mkdir -p app app/src/main app/src/main/java/org/uswa/hadith app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Uswa"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'org.uswa.hadith'
              compileSdk 34

              defaultConfig {
                  applicationId "org.uswa.hadith"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/org/uswa/hadith/MainActivity.java <<'EOF'
          package org.uswa.hadith;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#0B5D4B"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0D1714"));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0D1714"));
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setTextZoom(100);
                  s.setAllowFileAccess(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if ("file".equals(u.getScheme())) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState == null) {
                      web.loadUrl("file:///android_asset/index.html");
                  } else {
                      web.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  String js = "(function(){var w=document.getElementById('wl');"
                          + "if(w&&w.classList.contains('s')){wlHide();return 1}"
                          + "var b=document.getElementById('bk');"
                          + "if(b&&b.classList.contains('s')){closeSh();return 1}return 0})()";
                  web.evaluateJavascript(js, value -> {
                      if (!"1".equals(value)) {
                          finish();
                      }
                  });
              }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">أُسوَة</string>
          </resources>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">#0D1714</item>
                  <item name="android:statusBarColor">#0B5D4B</item>
                  <item name="android:navigationBarColor">#0D1714</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#0B5D4B</color>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#E9C46A" android:pathData="M54.00,27.00 L59.17,41.53 L73.09,34.91 L66.47,48.83 L81.00,54.00 L66.47,59.17 L73.09,73.09 L59.17,66.47 L54.00,81.00 L48.83,66.47 L34.91,73.09 L41.53,59.17 L27.00,54.00 L41.53,48.83 L34.91,34.91 L48.83,41.53 Z" />
              <path android:fillColor="#0B5D4B" android:pathData="M54,44 L64,54 L54,64 L44,54 Z" />
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF
          cd "$W"
          HTML=index.html
          if [ ! -f "$HTML" ]; then HTML=$(ls *.html 2>/dev/null | head -n 1 || true); fi
          if [ -z "$HTML" ]; then echo "ERROR: no index.html found in the repository root"; exit 1; fi
          echo "Using $HTML"
          cp "$HTML" "$A/app/src/main/assets/index.html"
          echo "APK_PROJECT=$A" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$APK_PROJECT"
          gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Collect the APK
        shell: bash
        run: |
          cp "$APK_PROJECT/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/Uswa.apk"
          ls -la "$GITHUB_WORKSPACE/Uswa.apk"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uswa-APK
          path: Uswa.apk

      - name: Publish the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Uswa build ${{ github.run_number }}
          files: Uswa.apk
